<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Universal AI Software Company OS — 2-Layer Architecture &amp; 5-Phase Execution Pipeline</title>
  <desc id="pipe-desc">Architectural diagram illustrating the separation between Layer 1 (Universal Company Engine) and Layer 2 (project-context.md), followed by the 5-Phase Execution Pipeline: Phase 1 Product and CTO Lock, Phase 2 Parallel Build with non-overlapping folders, Phase 3 Security and CWE Audit, Phase 4 5-Stage QA and Reality-Checker Gate, and Phase 5 DevOps, FinOps, and DevRel Docs.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1424" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>

    <!-- Card Gradients -->
    <linearGradient id="layer-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="phase-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FB7185" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" rx="18" fill="url(#bg)" />
  <rect width="1200" height="520" rx="18" fill="url(#grid)" />

  <!-- ==================== HEADER ==================== -->
  <text x="36" y="38" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.3">
    2-Layer Engine vs. Context Separation &amp; 5-Phase Zero-Collision Execution Pipeline
  </text>
  <g transform="translate(868, 17)">
    <rect width="296" height="28" rx="14" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4" fill="#818CF8" />
    <text x="155" y="18" text-anchor="middle" fill="#E0E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">ORCHESTRATED BY: ceo-executive-orchestrator</text>
  </g>

  <!-- ==================== TOP SECTION: 2-LAYER ARCHITECTURE ==================== -->
  <!-- Layer 1 Box -->
  <g transform="translate(36, 56)">
    <rect width="540" height="84" rx="12" fill="url(#layer-card)" stroke="#6366F1" stroke-width="1.5" />
    <rect x="14" y="14" width="108" height="22" rx="5" fill="#312E81" />
    <text x="68" y="28.5" text-anchor="middle" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">LAYER 1 • ENGINE</text>
    <text x="134" y="29" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">100% Project-Agnostic Company OS</text>
    <text x="16" y="53" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      Reusable across any repo: <tspan fill="#E2E8F0" font-weight="600">11 Department Lead Agents</tspan> + <tspan fill="#E2E8F0" font-weight="600">34 Core Technical Skills</tspan>
    </text>
    <text x="16" y="71" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">
      AGENTS.md &#8226; .agents/agents/*.md &#8226; .agents/skills/*/SKILL.md
    </text>
  </g>

  <!-- Bidirectional Binding Connector -->
  <g transform="translate(576, 82)">
    <line x1="6" y1="16" x2="42" y2="16" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)" marker-start="url(#arrow-indigo)" />
    <text x="24" y="8" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700">BINDS</text>
  </g>

  <!-- Layer 2 Box -->
  <g transform="translate(624, 56)">
