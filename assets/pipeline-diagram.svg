    <text x="22" y="121" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">src/backend/ &#8226; src/db/ &#8226; migrations/</text>

    <rect x="14" y="136" width="240" height="42" rx="7" fill="#0F172A" stroke="#0891B2" stroke-opacity="0.6" stroke-width="1" />
    <text x="22" y="153" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Dept 5: frontend-ux-engineer</text>
    <text x="22" y="169" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">src/ui/ &#8226; src/client/ &#8226; public/</text>

    <rect x="14" y="184" width="240" height="42" rx="7" fill="#0F172A" stroke="#0891B2" stroke-opacity="0.6" stroke-width="1" />
    <text x="22" y="201" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Dept 6: ai-agentic-engineer</text>
    <text x="22" y="217" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">src/router/ &#8226; src/search/ &#8226; src/eval/</text>

    <rect x="14" y="232" width="240" height="42" rx="7" fill="#0F172A" stroke="#0891B2" stroke-opacity="0.6" stroke-width="1" />
    <text x="22" y="249" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Dept 7: ai-ml-langchain-lead</text>
