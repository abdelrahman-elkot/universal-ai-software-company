  <path d="M 883 450 L 883 486 L 406 486 L 406 456" fill="none" stroke="#FB7185" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-rose)" />
  <line x1="665" y1="450" x2="665" y2="486" stroke="#FB7185" stroke-width="2" stroke-dasharray="4 3" />
