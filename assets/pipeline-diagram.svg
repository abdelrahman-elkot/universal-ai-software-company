    <text x="22" y="143" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Scope, Active Squad &amp; UX specs</text>

    <rect x="14" y="165" width="176" height="48" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="22" y="182" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">Dept 3: cto-cloud-architect</text>
