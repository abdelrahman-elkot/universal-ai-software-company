    <circle cx="16" cy="14" r="4" fill="#34D399" />
    <text x="184" y="18" text-anchor="middle" fill="#E0E7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">RULE #0: CEO IS DISPATCHER ONLY &#8226; DYNAMIC SQUADS</text>
  </g>

