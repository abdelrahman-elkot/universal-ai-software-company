    <rect x="14" y="12" width="118" height="22" rx="5" fill="#312E81" />
    <text x="73" y="26.5" text-anchor="middle" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">LAYER 1 &#8226; ENGINE</text>
