    <text x="16" y="60" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800">Zero-Collision Parallel Work</text>
    <text x="16" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Strict non-overlapping folder ownership:</text>

