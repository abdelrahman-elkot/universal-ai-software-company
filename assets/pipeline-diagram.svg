    <rect x="14" y="14" width="114" height="22" rx="5" fill="#164E63" />
    <text x="71" y="28.5" text-anchor="middle" fill="#A5F3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">LAYER 2 • CONTEXT</text>
    <text x="140" y="29" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Single Project Identity Card</text>
    <text x="16" y="53" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
