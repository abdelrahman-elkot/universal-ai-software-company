    <text x="16" y="84" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">Read project-context.md &amp; lock</text>
    <text x="16" y="100" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500">contracts before coding starts.</text>

    <!-- Active Agents -->
    <rect x="14" y="116" width="176" height="44" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="24" y="133" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Dept 2: product-pmo-lead</text>
    <text x="24" y="150" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Atomic specs &amp; acceptance</text>

    <rect x="14" y="168" width="176" height="44" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="24" y="185" fill="#C7D2FE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">Dept 3: cto-cloud-architect</text>
    <text x="24" y="202" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10.5">Shared APIs, DB &amp; FinOps</text>

    <!-- Locked Outputs -->
    <rect x="14" y="224" width="176" height="46" rx="8" fill="#1E1B4B" fill-opacity="0.65" stroke="#4F46E5" stroke-width="1" />
    <text x="24" y="241" fill="#A5B4FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">LOCKED ARTIFACTS:</text>
    <text x="24" y="258" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">specs/ &#8226; src/types/</text>
